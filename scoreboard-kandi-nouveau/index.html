<html>
  <head>
    <meta charset="utf-8" />
    <script src="../include/globals.js"></script>
    <link rel="stylesheet" href="./index.css" />
  </head>

  <body>
    <div class="scoreboard-main">
      <div class="player-wrapper container p1">
        <div class="score"></div>

        <div class="player-info">
          <div class="p1 player container fade_right">
            <div class="name"></div>
          </div>

          <div class="p1 chips">
            <span class="pronoun chip"></span>
            <span class="bullet">•</span>
            <span class="seed chip"></span>
          </div>
        </div>
      </div>

      <img src="./logo-kandi.svg" width="231" height="141" />

      <div class="player-wrapper container p2">
        <div class="score"></div>

        <div class="player-info">
          <div class="p2 player container fade_left">
            <div class="name"></div>
          </div>

          <div class="p2 chips">
            <span class="pronoun chip"></span>
            <span class="bullet">•</span>
            <span class="seed chip"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="phase-match fade">
      <div class="phase"></div>
      <div class="bullet">•</div>
      <div class="match"></div>
    </div>

    <script src="../scoreboard/index.js"></script>
  </body>
</html>
