Layout très fortement inspiré par le scoreboard traditionnel Super Smash Bros. Ultimate
https://github.com/TournamentStreamHelper/TournamentStreamHelper-layouts/blob/main/scoreboard/ssbultimate.html
sous license MIT
-->
<html>
  <head>
    <meta charset="utf-8" />
    <script src="../include/globals.js"></script>
    <link rel="stylesheet" href="./index.css" />
  </head>

  <body>
    <div class="scoreboard-main">
      <div class="player-wrapper">
        <div class="player container p1">
          <div class="score"></div>
        </div>

        <div class="p1 player container fade_right">
          <div class="name"></div>
          <div class="character_container"></div>
        </div>

        <div class="p1 chips">
          <div class="pronoun chip"></div>
          <svg
            width="10"
            height="31"
            viewBox="0 0 6 21"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            class="chips-divider"
          >
            <path d="M0 21V0H5.62693L0 21Z" fill="white" />
          </svg>
          <div class="seed chip"></div>
        </div>
      </div>

      <img src="./logo-kandi.svg" width="231" height="141" />

      <div class="player-wrapper">
        <div class="p2 player container fade_left">
          <div class="character_container"></div>
          <div class="name"></div>
        </div>
        <div class="p2 chips">
          <div class="pronoun chip"></div>
          <svg
            width="10"
            height="31"
            viewBox="0 0 6 21"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            class="chips-divider"
          >
            <path d="M0 21V0H5.62693L0 21Z" fill="white" />
          </svg>
          <div class="seed chip"></div>
        </div>


        <div class="player container p2">
          <div class="score"></div>
        </div>
      </div>
    </div>

    <div class="phase-match fade">
      <div class="phase"></div>
      <div class="bullet">•</div>
      <div class="match"></div>
    </div>

    <script src="../scoreboard/index.js"></script>
  </body>
</html>
